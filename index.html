<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lyric Vault: A Taylor Swift Guessing Game</title>
    <style>
        :root {
            --bg-color: #fbf9f4;
            --card-bg: #ffffff;
            --primary-color: #6d5f7c;
            --text-color: #2c2530;
            --accent-color: #c9b4a6;
            --success-color: #4f7353;
            --error-color: #944545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Playfair Display', Georgia, serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(109, 95, 124, 0.06);
            border: 1px solid rgba(201, 180, 166, 0.2);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: 700;
        }

        .subtitle {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* Mode Toggle Tabs */
        .mode-toggle {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .mode-tab {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: #aaa;
            text-align: center;
            transition: all 0.2s;
        }

        .mode-tab.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            margin-bottom: -2px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            font-family: -apple-system, sans-serif;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary-color); }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #554961; }

        /* Game Screen Layout Elements */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .metadata-tag {
            font-family: -apple-system, sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            font-weight: 600;
        }

        .timer-tag {
            font-family: monospace, sans-serif;
            font-size: 1.1rem;
            color: var(--error-color);
            font-weight: bold;
            background: rgba(148, 69, 69, 0.08);
            padding: 4px 10px;
            border-radius: 4px;
            display: none;
        }

        .last-result-banner {
            font-family: -apple-system, sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.2s ease-in-out;
            display: inline-block;
            width: 100%;
        }

        .last-result-banner.show { opacity: 1; transform: translateY(0); }
        .last-result-banner.correct { background-color: rgba(79, 115, 83, 0.08); color: var(--success-color); }
        .last-result-banner.incorrect { background-color: rgba(148, 69, 69, 0.08); color: var(--error-color); }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #eee;
            border-radius: 2px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.15s ease;
        }

        .lyric-card {
            background-color: #fefdfb;
            border-top: 1px solid rgba(201, 180, 166, 0.3);
            border-bottom: 1px solid rgba(201, 180, 166, 0.3);
            padding: 40px 20px;
            margin-bottom: 30px;
            font-style: italic;
            font-size: 1.45rem;
            line-height: 1.7;
            color: #3b3240;
        }

        .hint-text {
            font-family: -apple-system, sans-serif;
            font-size: 0.8rem;
            color: #999;
            margin-top: 10px;
            display: block;
        }

        .score-display {
            font-size: 3.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px 0;
        }

        /* Leaderboard and Summaries Table Styles */
        .leaderboard-title {
            font-family: -apple-system, sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-color);
            margin-top: 30px;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: left;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-family: -apple-system, sans-serif;
            font-size: 0.9rem;
            margin-bottom: 30px;
            background: #fafaf8;
            border-radius: 8px;
            overflow: hidden;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 12px 15px;
            text-align: left;
        }

        .leaderboard-table th {
            background-color: #eae7e1;
            color: #555;
            font-weight: 600;
        }

        .leaderboard-table tr { border-bottom: 1px solid #eee; }
        .leaderboard-table tr:last-child { border: none; }

        .incorrect-list {
            text-align: left;
            margin: 25px 0;
            max-height: 200px;
            overflow-y: auto;
            background: #fdfdfd;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .incorrect-item {
            font-size: 0.9rem;
            margin-bottom: 12px;
            border-bottom: 1px solid #f5f5f5;
            padding-bottom: 8px;
        }
        .incorrect-item:last-child { border: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>The Lyric Vault</h1>
    <div class="subtitle">A Taylor Swift Guessing Game</div>

    <div id="setup-screen" class="screen active">
        <div class="mode-toggle">
            <div id="tab-casual" class="mode-tab active" onclick="setMode('casual')">Casual Mode</div>
            <div id="tab-comp" class="mode-tab" onclick="setMode('comp')">Competition Mode</div>
        </div>

        <div id="casual-fields">
            <div class="form-group">
                <label id="question-label" for="num-questions">Loading database...</label>
                <input type="number" id="num-questions" min="1" value="5">
            </div>
        </div>

        <div id="comp-fields" style="display: none;">
            <div class="form-group">
                <label for="player-name">Enter Player Name / Initials:</label>
                <input type="text" id="player-name" placeholder="e.g. T.S." maxlength="15" autocomplete="off">
            </div>
            <div class="form-group" style="opacity: 0.85;">
                <label>Competition Rules:</label>
                <p style="font-family:-apple-system, sans-serif; font-size:0.9rem; line-height:1.5; color:#444;" id="comp-rules-desc">
                    </p>
            </div>
        </div>

        <button onclick="startGame()">Enter the Vault</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="last-result" class="last-result-banner"></div>

        <div class="game-header">
            <div class="metadata-tag" id="question-tracker">Question 1 of X</div>
            <div class="timer-tag" id="game-timer">30:00</div>
        </div>

        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>

        <div id="lyric-display" class="lyric-card"></div>

        <div class="form-group">
            <input type="text" id="answer-input" placeholder="What song is this?" autocomplete="off">
            <span class="hint-text">Press Enter to submit and load the next question instantly</span>
        </div>
        <button id="action-btn" onclick="submitAnswer()">Submit Guess</button>
    </div>

    <div id="results-screen" class="screen">
        <h2 id="end-status-heading">Quiz Complete</h2>
        <div id="score-display" class="score-display">0/0</div>
        <p id="time-spent-display" style="font-family:-apple-system, sans-serif; margin-bottom:15px; display:none;"></p>

        <div id="leaderboard-panel" style="display: none;">
            <div class="leaderboard-title">&#x1F3C6; Vault Leaderboard</div>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Score</th>
                        <th>Time Taken</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-rows">
                    </tbody>
            </table>
        </div>

        <div id="incorrect-summary" class="incorrect-list" style="display:none;"></div>
        <button id="restart-btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script src="song_database.js"></script>

<script>
    let gameQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let wrongSongs = [];

    let currentGameMode = 'casual';
    let currentPlayerName = "Anonymous";

    let timerInterval = null;
    const TOTAL_COMP_TIME = 30 * 60; // 30 minutes in seconds
    let secondsRemaining = TOTAL_COMP_TIME;

    if (typeof songDatabase === 'undefined') {
        alert("Error: song_database.js file not found! Please run your Python data engine first.");
    }

    function pure(text) {
        return text.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    document.addEventListener("DOMContentLoaded", () => {
        const numInput = document.getElementById("num-questions");
        const label = document.getElementById("question-label");

        numInput.max = songDatabase.length;
        numInput.value = Math.min(10, songDatabase.length);
        label.innerText = `How many questions would you like? (Max available: ${songDatabase.length})`;

        // Setup your requested, ultra-clean formatting examples
        document.getElementById("comp-rules-desc").innerHTML = `
            &#x23F0; <strong>Time Limit:</strong> You have 30 minutes.<br><br>

            <strong style="font-family: -apple-system, sans-serif; font-size: 0.95rem; display: block; margin-bottom: 8px;">Game Rules:</strong>
            <ul style="list-style-type: none; margin-left: 5px; padding-left: 0; font-family: -apple-system, sans-serif;">
                <li style="margin-bottom: 8px;">
                    &#x1F7E2; <strong>Not case sensitive</strong>
                </li>
                <li style="margin-bottom: 8px;">
                    &#x1F7E2; <strong>Spaces and symbols are ignored</strong>
                </li>
                <li style="margin-bottom: 8px;">
                    &#x1F7E2; <strong>"and" and "&" are interchangeable</strong>
                </li>
                <li style="margin-bottom: 12px;">
                    &#x1F7E2; <strong>( ) and [ ] are ignored</strong>
                </li>
            </ul>

            <strong style="font-family: -apple-system, sans-serif; font-size: 0.95rem; display: block; margin-bottom: 8px; margin-top: 15px;">Correct Examples:</strong>
            <ul style="list-style-type: none; margin-left: 5px; padding-left: 0; font-family: -apple-system, sans-serif;">
                <li style="margin-bottom: 10px;">
                    &#x2705; <code style="font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #a8456a; background: #fdf2f6; padding: 2px 6px; border-radius: 4px; font-size: 1rem;">me</code> will match "ME!"
                </li>
                <li style="margin-bottom: 10px;">
                    &#x2705; <code style="font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #a8456a; background: #fdf2f6; padding: 2px 6px; border-radius: 4px; font-size: 1rem;">I can see you</code> will match "I Can See You (Taylor's Version) [From The Vault]"
                </li>
                <li style="margin-bottom: 10px;">
                    &#x2705; <code style="font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #a8456a; background: #fdf2f6; padding: 2px 6px; border-radius: 4px; font-size: 1rem;">weareneverevergettingbacktogether</code> will match "We Are Never Ever Getting Back Together"
                </li>
                <li style="margin-bottom: 10px;">
                    &#x2705; <code style="font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #a8456a; background: #fdf2f6; padding: 2px 6px; border-radius: 4px; font-size: 1rem;">i can fix him no really i can</code> will match "I Can Fix Him (No Really I Can)"
                </li>
                <li style="margin-bottom: 12px;">
                    &#x2705; <code style="font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #a8456a; background: #fdf2f6; padding: 2px 6px; border-radius: 4px; font-size: 1rem;">i can fix him</code> will also match "I Can Fix Him (No Really I Can)"
                </li>
            </ul>

            <strong style="font-family: -apple-system, sans-serif; font-size: 0.95rem; display: block; margin-bottom: 8px; margin-top: 15px;">Incorrect Example:</strong>
            <ul style="list-style-type: none; margin-left: 5px; padding-left: 0; font-family: -apple-system, sans-serif;">
                <li>
                    &#x274C; <code style="font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #b05858; background: #fbebeb; padding: 2px 6px; border-radius: 4px; font-size: 1rem;">missamericanatheheartbreakprince</code> will <strong style="color: var(--error-color);">NOT</strong> match "Miss Americana and The Heartbreak Prince" (Don't skip the word "and"!)
                </li>
            </ul>
        `;

        numInput.focus();
    });

    function setMode(mode) {
        currentGameMode = mode;
        document.getElementById('tab-casual').classList.toggle('active', mode === 'casual');
        document.getElementById('tab-comp').classList.toggle('active', mode === 'comp');
        document.getElementById('casual-fields').style.display = (mode === 'casual') ? 'block' : 'none';
        document.getElementById('comp-fields').style.display = (mode === 'comp') ? 'block' : 'none';

        if (mode === 'casual') {
            document.getElementById("num-questions").focus();
        } else {
            document.getElementById("player-name").focus();
        }
    }

    document.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            if (document.getElementById("setup-screen").classList.contains("active")) {
                startGame();
            } else if (document.getElementById("results-screen").classList.contains("active")) {
                restartGame();
            }
        }
    });

    function startGame() {
        wrongSongs = [];
        score = 0;
        currentQuestionIndex = 0;

        let quizNum = 5;

        if (currentGameMode === 'casual') {
            quizNum = parseInt(document.getElementById("num-questions").value) || 5;
            if (songDatabase.length < quizNum) {
                alert("Error: Not enough songs for requested quiz number!");
                return;
            }
        } else {
            quizNum = songDatabase.length;
            const nameInput = document.getElementById("player-name").value.trim();
            if (!nameInput) {
                alert("Please enter your name/initials to register for the leaderboard!");
                return;
            }
            currentPlayerName = nameInput;

            // Activate Global Fuse Timer Configuration
            secondsRemaining = TOTAL_COMP_TIME;
            document.getElementById("game-timer").style.display = "block";
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(tickTimer, 1000);
        }

        // Randomize list mapping selection pool
        const chosenSongs = [...songDatabase].sort(() => 0.5 - Math.random()).slice(0, quizNum);
        gameQuestions = chosenSongs.map(song => {
            const randomSnippet = song.snippets[Math.floor(Math.random() * song.snippets.length)];
            return { title: song.title, lyric: randomSnippet };
        });

        const banner = document.getElementById("last-result");
        banner.className = "last-result-banner";
        banner.innerText = "";

        showScreen("game-screen");
        loadQuestion();
    }

    function tickTimer() {
        secondsRemaining--;
        updateTimerDisplay();

        if (secondsRemaining <= 0) {
            clearInterval(timerInterval);
            alert("ð Time's up! The vault has locked down!");
            showResults(true);
        }
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(secondsRemaining / 60);
        const seconds = secondsRemaining % 60;
        document.getElementById("game-timer").innerText =
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function loadQuestion() {
        const answerInput = document.getElementById("answer-input");
        answerInput.value = "";
        answerInput.readOnly = false;
        answerInput.disabled = false;

        setTimeout(() => { answerInput.focus(); }, 5);

        const currentQuestion = gameQuestions[currentQuestionIndex];
        document.getElementById("lyric-display").innerText = `"${currentQuestion.lyric}"`;
        document.getElementById("question-tracker").innerText = `Question ${currentQuestionIndex + 1} of ${gameQuestions.length}`;

        const progressPercent = (currentQuestionIndex / gameQuestions.length) * 100;
        document.getElementById("progress-fill").style.width = `${progressPercent}%`;

        const actionBtn = document.getElementById("action-btn");
        actionBtn.innerText = (currentQuestionIndex + 1 < gameQuestions.length) ? "Submit Guess" : "Finish Quiz";
    }

    function submitAnswer() {
        const answerInput = document.getElementById("answer-input");
        const currentQuestion = gameQuestions[currentQuestionIndex];
        const banner = document.getElementById("last-result");

        const answer = pure(answerInput.value);

        // --- ADVANCED TARGET MATCHING ENGINE ---

        // 1. Establish the base standard title target
        const standardTarget = pure(currentQuestion.title);
        let isCorrect = (answer === standardTarget);

        // 2. Cross-check explicit aliases from the database if they exist
        if (!isCorrect && currentQuestion.aliases && currentQuestion.aliases.length > 0) {
            isCorrect = currentQuestion.aliases.some(alias => pure(alias) === answer);
        }

        // 3. SPECIAL CASE A: Dynamic "and" / "&" cross-matching
        if (!isCorrect) {
            // Check if swapping "and" for "&" makes a match
            const explicitAndTarget = pure(currentQuestion.title.toLowerCase().replace(/&/g, 'and'));
            const explicitAmpTarget = pure(currentQuestion.title.toLowerCase().replace(/\band\b/g, '')); // Strips "and" like raw &

            if (answer === explicitAndTarget || answer === explicitAmpTarget) {
                isCorrect = true;
            }
        }

        // 4. SPECIAL CASE B: Parentheses Truncation (e.g. "Mary's Song (Oh My My My)")
        if (!isCorrect && currentQuestion.title.includes('(')) {
            // Extract just the portion before the open parenthesis "("
            const mainTitlePart = currentQuestion.title.split('(')[0];
            const shortTarget = pure(mainTitlePart);

            if (answer === shortTarget) {
                isCorrect = true;
            }
        }

        // --- EXECUTE SCORE ACTIONS ---
        if (isCorrect) {
            score++;
            // FIXED: Using innerHTML forces the browser to turn the hex code into a real emoji!
            banner.innerHTML = `&#x2705; Correct: "${currentQuestion.title}"`;
            banner.className = "last-result-banner show correct";
        } else {
            wrongSongs.push({ title: currentQuestion.title, lyric: currentQuestion.lyric });
            // FIXED: Using innerHTML here handles the incorrect cross code perfectly too!
            banner.innerHTML = `&#x274C; Last Answer: "${currentQuestion.title}"`;
            banner.className = "last-result-banner show incorrect";
        }

        currentQuestionIndex++;
        if (currentQuestionIndex < gameQuestions.length) {
            loadQuestion();
        } else {
            clearInterval(timerInterval);
            showResults(false);
        }
    }

    document.getElementById("answer-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            submitAnswer();
        }
    });

    function showResults(forcedTimeout = false) {
        document.getElementById("progress-fill").style.width = "100%";
        document.getElementById("game-timer").style.display = "none";
        showScreen("results-screen");

        document.getElementById("score-display").innerText = `${score} / ${gameQuestions.length}`;
        document.getElementById("end-status-heading").innerText = forcedTimeout ? "Time's Up!" : "Quiz Complete";

        const timeDisplay = document.getElementById("time-spent-display");

        if (currentGameMode === 'comp') {
            const timeSpentSeconds = TOTAL_COMP_TIME - secondsRemaining;
            const displayMin = Math.floor(timeSpentSeconds / 60);
            const displaySec = timeSpentSeconds % 60;
            timeDisplay.innerText = `Total Completion Time: ${displayMin}m ${displaySec}s`;
            timeDisplay.style.display = "block";

            // Store and Sort Local Database Score Metrics
            saveScoreToLeaderboard(currentPlayerName, score, gameQuestions.length, timeSpentSeconds);
            renderLeaderboardTable();
            document.getElementById("leaderboard-panel").style.display = "block";
        } else {
            timeDisplay.style.display = "none";
            document.getElementById("leaderboard-panel").style.display = "none";
        }

        document.getElementById("restart-btn").focus();

        const summaryDiv = document.getElementById("incorrect-summary");
        if (wrongSongs.length > 0) {
            summaryDiv.style.display = "block";
            summaryDiv.innerHTML = "<strong>Review What You Missed:</strong><br><br>";
            wrongSongs.forEach(item => {
                summaryDiv.innerHTML += `<div class="incorrect-item">Correct Answer: <strong>${item.title}</strong><br><small style="color:#777;">"${item.lyric}"</small></div>`;
            });
        } else {
            summaryDiv.style.display = "none";
        }
    }

    function saveScoreToLeaderboard(name, score, total, seconds) {
        let currentScores = JSON.parse(localStorage.getItem('ts_vault_leaderboard')) || [];

        currentScores.push({
            name: name,
            score: score,
            total: total,
            timeSpent: seconds,
            date: new Date().toLocaleDateString()
        });

        // Hierarchy Rank Engine: Accuracy (DESC) -> Finish Speed (ASC)
        currentScores.sort((a, b) => {
            if (b.score !== a.score) {
                return b.score - a.score;
            }
            return a.timeSpent - b.timeSpent;
        });

        currentScores = currentScores.slice(0, 10);
        localStorage.setItem('ts_vault_leaderboard', JSON.stringify(currentScores));
    }

    function renderLeaderboardTable() {
        const scores = JSON.parse(localStorage.getItem('ts_vault_leaderboard')) || [];
        const tbody = document.getElementById("leaderboard-rows");
        tbody.innerHTML = "";

        if (scores.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">The vault leaderboard is currently empty.</td></tr>`;
            return;
        }

        scores.forEach((entry, idx) => {
            const min = Math.floor(entry.timeSpent / 60);
            const sec = entry.timeSpent % 60;
            const timeStr = `${min}m ${sec}s`;

            tbody.innerHTML += `
                <tr>
                    <td><strong>#${idx + 1}</strong></td>
                    <td>${escapeHtml(entry.name)}</td>
                    <td>${entry.score}/${entry.total}</td>
                    <td>${timeStr}</td>
                </tr>
            `;
        });
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function restartGame() {
        clearInterval(timerInterval);
        showScreen("setup-screen");
        setTimeout(() => {
            if(currentGameMode === 'casual') {
                document.getElementById("num-questions").focus();
            } else {
                document.getElementById("player-name").focus();
            }
        }, 10);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>
