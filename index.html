<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lyric Vault: A Taylor Swift Guessing Game</title>
    <style>
        :root {
            --bg-color: #fbf9f4;
            --card-bg: #ffffff;
            --primary-color: #6d5f7c;
            --text-color: #2c2530;
            --accent-color: #c9b4a6;
            --success-color: #4f7353;
            --error-color: #944545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Playfair Display', Georgia, serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(109, 95, 124, 0.06);
            border: 1px solid rgba(201, 180, 166, 0.2);
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: 700;
        }

        .subtitle {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* Mode Toggle Tabs */
        .mode-toggle {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .mode-tab {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: #aaa;
            text-align: center;
            transition: all 0.2s;
        }

        .mode-tab.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            margin-bottom: -2px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            font-family: -apple-system, sans-serif;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary-color); }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #554961; }

        /* Game Screen Layout Elements */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .metadata-tag {
            font-family: -apple-system, sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            font-weight: 600;
        }

        .timer-tag {
            font-family: monospace, sans-serif;
            font-size: 1.1rem;
            color: var(--error-color);
            font-weight: bold;
            background: rgba(148, 69, 69, 0.08);
            padding: 4px 10px;
            border-radius: 4px;
            display: none;
        }

        .last-result-banner {
            font-family: -apple-system, sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.2s ease-in-out;
            display: inline-block;
            width: 100%;
        }

        .last-result-banner.show { opacity: 1; transform: translateY(0); }
        .last-result-banner.correct { background-color: rgba(79, 115, 83, 0.08); color: var(--success-color); }
        .last-result-banner.incorrect { background-color: rgba(148, 69, 69, 0.08); color: var(--error-color); }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #eee;
            border-radius: 2px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.15s ease;
        }

        .lyric-card {
            background-color: #fefdfb;
            border-top: 1px solid rgba(201, 180, 166, 0.3);
            border-bottom: 1px solid rgba(201, 180, 166, 0.3);
            padding: 40px 20px;
            margin-bottom: 30px;
            font-style: italic;
            font-size: 1.45rem;
            line-height: 1.7;
            color: #3b3240;
        }

        .hint-text {
            font-family: -apple-system, sans-serif;
            font-size: 0.8rem;
            color: #999;
            margin-top: 10px;
            display: block;
        }

        .score-display {
            font-size: 3.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px 0;
        }

        /* Leaderboard and Summaries Table Styles */
        .leaderboard-title {
            font-family: -apple-system, sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-color);
            margin-top: 30px;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: left;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-family: -apple-system, sans-serif;
            font-size: 0.9rem;
            margin-bottom: 30px;
            background: #fafaf8;
            border-radius: 8px;
            overflow: hidden;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 12px 15px;
            text-align: left;
        }

        .leaderboard-table th {
            background-color: #eae7e1;
            color: #555;
            font-weight: 600;
        }

        .leaderboard-table tr { border-bottom: 1px solid #eee; }
        .leaderboard-table tr:last-child { border: none; }

        .incorrect-list {
            text-align: left;
            margin: 25px 0;
            max-height: 200px;
            overflow-y: auto;
            background: #fdfdfd;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .incorrect-item {
            font-size: 0.9rem;
            margin-bottom: 12px;
            border-bottom: 1px solid #f5f5f5;
            padding-bottom: 8px;
        }
        .incorrect-item:last-child { border: none; }

        /* --- AUTOMATED ADVANCED MOBILE OPTIMIZATION LAYER --- */
        @media (max-width: 600px) {
            body {
                align-items: flex-start; /* Push layout container to top so virtual keyboard does not block view */
                padding: 10px;
                min-height: auto;
            }

            .container {
                padding: 20px 15px;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(109, 95, 124, 0.04);
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                margin-bottom: 15px;
                font-size: 0.75rem;
            }

            .lyric-card {
                padding: 25px 10px;
                font-size: 1.2rem;
                margin-bottom: 20px;
            }

            /* Responsive layout configurations for the album grid rules */
            #album-checkboxes {
                grid-template-columns: 1fr !important; /* Force checkboxes to single file list on tiny viewports */
                max-height: 120px !important;
                gap: 8px !important;
            }

            input[type="number"], input[type="text"] {
                padding: 12px 14px;
                font-size: 0.95rem; /* Prevents iOS Safari from forcefully auto-zooming onto input fields */
            }

            button {
                padding: 12px 20px;
                font-size: 0.95rem;
            }

            .leaderboard-table th, .leaderboard-table td {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            
            .hint-text {
                display: none; /* Hide desktop-only "Press Enter" hint lines on mobile viewports */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>The Lyric Vault</h1>
    <div class="subtitle">A Taylor Swift Guessing Game</div>

    <div id="setup-screen" class="screen active">
        <div class="mode-toggle">
            <div id="tab-casual" class="mode-tab active" onclick="setMode('casual')">Casual Mode</div>
            <div id="tab-comp" class="mode-tab" onclick="setMode('comp')">Competition Mode</div>
        </div>

        <div id="casual-fields">
            <div class="form-group">
                <label style="display: block; margin-bottom: 8px;">Select Albums to Include:</label>
                <div id="album-checkboxes" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; max-height: 150px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #ddd; font-family: -apple-system, sans-serif; margin-bottom: 20px;">
                    </div>
            </div>
            <div class="form-group">
                <label id="question-label" for="num-questions">Loading database...</label>
                <input type="number" id="num-questions" min="1" value="5">
            </div>
        </div>

        <div id="comp-fields" style="display: none;">
            <div class="form-group">
                <label for="player-name">Enter Player Name / Initials:</label>
                <input type="text" id="player-name" placeholder="e.g. T.S." maxlength="15" autocomplete="off">
            </div>
            <div class="form-group" style="opacity: 0.85;">
                <label>Competition Rules:</label>
                <p style="font-family:-apple-system, sans-serif; font-size:0.9rem; line-height:1.5; color:#444;" id="comp-rules-desc">
                    </p>
            </div>
        </div>

        <button onclick="startGame()">Enter the Vault</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="last-result" class="last-result-banner"></div>

        <div class="game-header">
            <div class="metadata-tag" id="question-tracker">Question 1 of X</div>
            <div class="timer-tag" id="game-timer">30:00</div>
        </div>

        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>

        <div id="lyric-display" class="lyric-card"></div>

        <button id="hint-btn" onclick="getMoreLyric()" style="background-color: var(--accent-color); color: var(--text-color); max-width: 200px; margin: -15px auto 25px auto; display: block; font-size: 0.85rem; padding: 8px 15px;">
            🔍 Request More Lyric
        </button>

        <div
